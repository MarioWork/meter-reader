<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meter Reader</title>
    <meta name="description" content="Read a water meter from a photo" />
    <!-- The page background of each theme (THEME_COLOURS in src/common/utils/themeUtils.ts, which updates these). -->
    <meta name="theme-color" content="#e8f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06121f" media="(prefers-color-scheme: dark)" />
    <!-- Before the app and the stylesheet, so a dark page never flashes light. A file, not inline: the CSP allows no
         inline script. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

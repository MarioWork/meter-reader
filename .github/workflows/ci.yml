name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  # The committed Yarn release, relative to each package folder. Bump it here when packageManager changes.
  YARN_RELEASE: .yarn/releases/yarn-4.18.1.cjs

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version

      # The Yarn release is committed in .yarn/releases; Corepack only reads packageManager and hands over to it.
      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test

      - run: yarn build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # The route tests run against a real Postgres; the credentials match api/.env.test.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: meter
          POSTGRES_PASSWORD: meter
          POSTGRES_DB: meter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meter -d meter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: api/.node-version

      # The committed release runs through yarnPath, so no global Yarn or Corepack is needed (Node 26 has none).
      - run: node "$YARN_RELEASE" install --immutable
        env:
          # `prisma generate` (postinstall) reads prisma.config.ts, which needs some URL; nothing is contacted.
          DATABASE_URL: postgresql://meter:meter@localhost:5432/meter_test

      - run: node "$YARN_RELEASE" lint

      - run: node "$YARN_RELEASE" typecheck

      - run: node "$YARN_RELEASE" test

      - run: node "$YARN_RELEASE" build

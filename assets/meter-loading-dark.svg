<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 24" width="88" height="48">
  <style>
    .wheel { animation: roll linear infinite; }
    @keyframes roll { to { transform: translateY(-160px); } }
    @media (prefers-reduced-motion: reduce) { .wheel { animation: none; } }
  </style>
  <defs><clipPath id="window"><rect x="2" y="4" width="40" height="16"/></clipPath></defs>
  <rect x="1" y="1" width="42" height="22" rx="4" fill="none" stroke="#90e0ef" stroke-opacity="0.4" stroke-width="1.5"/>
  <g clip-path="url(#window)" fill="#48cae4" font-size="16" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g class="wheel" style="animation-duration:3.2s"><text x="6" y="18">0</text><text x="6" y="34">1</text><text x="6" y="50">2</text><text x="6" y="66">3</text><text x="6" y="82">4</text><text x="6" y="98">5</text><text x="6" y="114">6</text><text x="6" y="130">7</text><text x="6" y="146">8</text><text x="6" y="162">9</text><text x="6" y="178">0</text></g>
    <g class="wheel" style="animation-duration:1.6s"><text x="18" y="18">0</text><text x="18" y="34">1</text><text x="18" y="50">2</text><text x="18" y="66">3</text><text x="18" y="82">4</text><text x="18" y="98">5</text><text x="18" y="114">6</text><text x="18" y="130">7</text><text x="18" y="146">8</text><text x="18" y="162">9</text><text x="18" y="178">0</text></g>
    <g class="wheel" style="animation-duration:0.8s"><text x="30" y="18">0</text><text x="30" y="34">1</text><text x="30" y="50">2</text><text x="30" y="66">3</text><text x="30" y="82">4</text><text x="30" y="98">5</text><text x="30" y="114">6</text><text x="30" y="130">7</text><text x="30" y="146">8</text><text x="30" y="162">9</text><text x="30" y="178">0</text></g>
  </g>
</svg>
